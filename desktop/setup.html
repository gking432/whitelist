<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <title>Connect Business Assistant</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f7f8f5;
        color: #17231d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 28px;
      }

      main {
        width: 100%;
        max-width: 380px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 28px;
        font-size: 15px;
        font-weight: 700;
      }

      .mark {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        background: #d4ad32;
        color: #102c21;
        font-size: 20px;
      }

      h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1.25;
      }

      p {
        margin: 8px 0 0;
        color: #66726b;
        font-size: 13px;
        line-height: 1.6;
      }

      form {
        margin-top: 24px;
      }

      label {
        display: block;
        margin-bottom: 7px;
        font-size: 12px;
        font-weight: 650;
      }

      input {
        width: 100%;
        height: 42px;
        border: 1px solid #ccd2cd;
        border-radius: 6px;
        padding: 0 12px;
        background: white;
        color: inherit;
        font: inherit;
        font-size: 14px;
        outline: none;
      }

      input:focus {
        border-color: #1e4c39;
        box-shadow: 0 0 0 3px rgb(30 76 57 / 12%);
      }

      button {
        width: 100%;
        height: 42px;
        margin-top: 12px;
        border: 0;
        border-radius: 6px;
        background: #163c2c;
        color: white;
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      #message {
        min-height: 20px;
        margin-top: 10px;
        color: #a43c35;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <span class="mark" aria-hidden="true">N</span>
        Business Assistant
      </div>
      <h1>Connect this computer</h1>
      <p>
        Enter the secure workspace address supplied during setup. You will sign
        in once, then the assistant can run quietly and appear when calls arrive.
      </p>

      <form id="server-form">
        <label for="server-url">Workspace address</label>
        <input
          id="server-url"
          name="server-url"
          type="url"
          inputmode="url"
          autocomplete="url"
          placeholder="https://app.yourcompany.com"
          required
        />
        <button id="connect-button" type="submit">Connect computer</button>
        <div id="message" role="alert"></div>
      </form>
    </main>

    <script>
      const form = document.querySelector("#server-form");
      const input = document.querySelector("#server-url");
      const button = document.querySelector("#connect-button");
      const message = document.querySelector("#message");

      window.northstarDesktop.getRuntimeConfig().then((config) => {
        input.value = config.appUrl || "";
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        button.disabled = true;
        button.textContent = "Checking...";
        message.textContent = "";

        const result = await window.northstarDesktop.saveServerUrl(input.value);

        if (!result.ok) {
          message.textContent = result.error;
          button.disabled = false;
          button.textContent = "Connect computer";
        }
      });
    </script>
  </body>
</html>
