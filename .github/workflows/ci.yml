name: Production gates

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: production-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://build-check.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build_check_anon_key_longer_than_twenty_characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - run: supabase start
      - run: npm run verify:security
      - run: npm run verify:restore
      - if: always()
        run: supabase stop --no-backup

  containers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            dockerfile: Dockerfile
          - name: jobs
            dockerfile: deploy/jobs.Dockerfile
          - name: voice
            dockerfile: services/voice-stream/Dockerfile
          - name: connector-worker
            dockerfile: deploy/connector-worker.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.name }} image
        run: docker build -f "${{ matrix.dockerfile }}" -t "northstar-${{ matrix.name }}:${{ github.sha }}" .
